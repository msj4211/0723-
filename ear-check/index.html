function readStoredLang() {

}

function storeLang(lang) {

}

  setText('age-label', currentLang === 'en' ? EN.ageLabel : '나이');
  setText('date-label', currentLang === 'en' ? EN.dateLabel : '상담 날짜');
  setText('menstrual-toggle-text', currentLang === 'en' ? EN.menstrualToggle : '생리 전 또는 생리 중이신가요?');
  setText('calc-btn', currentLang === 'en' ? EN.calcBtn : '결과 확인하기');
  setText('page-footer', currentLang === 'en' ? EN.footer : '730스킨 이어테라피');

  var nameInput = document.getElementById('name');
  var ageInput = document.getElementById('age');
  if (nameInput) nameInput.placeholder = currentLang === 'en' ? EN.nameLabel : '이름';
  if (ageInput) ageInput.placeholder = currentLang === 'en' ? EN.ageLabel : '나이';

  var genderMaleBtn = document.querySelector('#gender-group [data-gender="male"]');
  var genderFemaleBtn = document.querySelector('#gender-group [data-gender="female"]');
  if (genderMaleBtn) genderMaleBtn.textContent = currentLang === 'en' ? EN.genderMale : '남성';
  if (genderFemaleBtn) genderFemaleBtn.textContent = currentLang === 'en' ? EN.genderFemale : '여성';

  document.querySelectorAll('.domain[data-domain-key]').forEach(function (section) {
    var key = section.getAttribute('data-domain-key');
    var h = section.querySelector('h2');
    if (h) h.textContent = domainLabel(key);
  });

  document.querySelectorAll('.item-row[data-item-id]').forEach(function (row) {
    var id = row.getAttribute('data-item-id');
    var label = row.querySelector('.item-label');
    if (label) label.textContent = itemText(id);

    var opts = optsText();
    var btnGroup = row.querySelector('.btn-group');
    if (btnGroup) {
      var btns = btnGroup.querySelectorAll('.opt-btn');
      btns.forEach(function (btn, idx) { btn.textContent = opts[idx]; });
    }
  });
}

function setLanguage(lang) {
  if (lang !== 'ko' && lang !== 'en') lang = 'ko';
  currentLang = lang;
  storeLang(lang);
  applyTranslations();
}

var answers = {};

function buildForm() {
  var formArea = document.getElementById('form-area');
  DOMAINS.forEach(function(d) {
    var section = document.createElement('div');
    section.className = 'domain';
    section.setAttribute('data-domain-key', d.key);
    var h = document.createElement('h2');
    h.textContent = domainLabel(d.key);
    section.appendChild(h);

    d.items.forEach(function(pair) {
      var itemId = pair[0];
      answers[itemId] = 0;

      var row = document.createElement('div');
      row.className = 'item-row';
      row.setAttribute('data-item-id', itemId);

      var label = document.createElement('div');
      label.className = 'item-label';
      label.textContent = itemText(itemId);
      row.appendChild(label);

      var btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';
      btnGroup.setAttribute('data-item', itemId);

      optsText().forEach(function(optText, idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';
        btn.textContent = optText;
        if (idx === 0) btn.classList.add('active');
        btn.addEventListener('click', function() {
          answers[itemId] = idx;
          var siblings = btnGroup.querySelectorAll('.opt-btn');
          for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('active');
          btn.classList.add('active');
        });
        btnGroup.appendChild(btn);
      });

      row.appendChild(btnGroup);
      section.appendChild(row);
    });

    if (d.conditional) {
      section.id = 'domain-' + d.key;
      section.style.display = 'none';
    }

    formArea.appendChild(section);
  });

  var menstrualToggle = document.getElementById('menstrual-toggle');
  if (menstrualToggle) {
    menstrualToggle.addEventListener('change', function() {
      var section = document.getElementById('domain-menstrual');
      if (section) section.style.display = menstrualToggle.checked ? 'block' : 'none';
    });
  }
}

function setupGenderToggle() {
  var genderGroup = document.getElementById('gender-group');
  var menstrualRow = document.getElementById('menstrual-row');
  var menstrualToggle = document.getElementById('menstrual-toggle');
  if (!genderGroup || !menstrualRow || !menstrualToggle) return;

  var genderBtns = genderGroup.querySelectorAll('.opt-btn');

  genderBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      for (var i = 0; i < genderBtns.length; i++) genderBtns[i].classList.remove('active');
      btn.classList.add('active');

      var isFemale = btn.getAttribute('data-gender') === 'female';
      menstrualRow.classList.toggle('is-visible', isFemale);

      if (!isFemale && menstrualToggle.checked) {
        menstrualToggle.checked = false;
        menstrualToggle.dispatchEvent(new Event('change'));
      }
    });
  });
}

function getTierIndex(avg) {
  if (avg <= TIER_LOW) return 0;
  if (avg <= TIER_HIGH) return 1;
  return 2;
}

// 채점 로직(합계·평균·반전·등급 판정) 자체는 이전과 완전히 동일하다.
// 마지막에 저장하는 값만 바뀌었다 — 예전에는 그 순간의 한국어 라벨·문구를
// 미리 계산해 저장했는데, 그러면 나중에 언어를 바꿔도 result.html은 이미
// 굳어버린 한국어 텍스트만 보여줄 수밖에 없었다. 대신 domainKey/tierIdx처럼
// 언어와 무관한 값만 저장하고, result.html이 그 시점에 활성화된 언어로
// 직접 문구를 찾아 그리도록 바꿨다 — sum/avg/tierIdx를 계산하는 코드는
// 한 글자도 바뀌지 않았고, 점수·평균·등급 판정 결과 자체는 그대로다.
function calculate() {
  var menstrualChecked = document.getElementById('menstrual-toggle').checked;
  var resultsData = [];

  DOMAINS.forEach(function(d) {
    if (d.conditional && !menstrualChecked) return;

    var sum = 0;
    d.items.forEach(function(pair) { sum += answers[pair[0]]; });
    var avg = sum / d.items.length;
    if (d.reverse) avg = MAX_SCORE - avg;
    avg = Math.round(avg * 10) / 10;

    var tierIdx;
    if (d.protective) {
      tierIdx = avg >= TIER_HIGH ? 2 : (avg >= TIER_LOW ? 1 : 0);
    } else {
      tierIdx = getTierIndex(avg);
    }

    resultsData.push({ domainKey: d.key, protective: !!d.protective, tierIdx: tierIdx, avg: avg, max: MAX_SCORE });
  });

  var payload = {
    name: document.getElementById('name').value,
    age: document.getElementById('age').value,
    date: document.getElementById('date').value,
    results: resultsData
  };
  sessionStorage.setItem('earCheckResult', JSON.stringify(payload));
  storeLang(currentLang);
  location.href = 'result.html';
}

// ── 부모(메인 사이트)와의 언어 동기화 ──
// event.origin과 event.source를 둘 다 확인해, 메인 사이트가 아닌 다른
// 곳에서 온 message는 전부 무시한다. language 값도 'ko'/'en' 화이트리스트
// 밖이면 버린다.
window.addEventListener('message', function (event) {
  if (PARENT_ALLOWED_ORIGINS.indexOf(event.origin) === -1) return;
  if (event.source !== window.parent) return;
  var data = event.data;
  if (!data || data.source !== '730-main-site' || data.type !== 'language-change') return;
  if (data.language !== 'ko' && data.language !== 'en') return;
  setLanguage(data.language);
});

// document.referrer는 이 문서를 iframe으로 띄운 부모 페이지의 주소다(같은
// 값이 페이지 로드 내내 바뀌지 않으므로 한 번만 계산해도 된다). 그 origin이
// PARENT_ALLOWED_ORIGINS 화이트리스트에 있을 때만 "안전하게 확인됨"으로
// 본다 — referrer가 없거나(리퍼러 정책 등으로 비어있는 경우) 화이트리스트
// 밖이면 null을 돌려주고, 호출하는 쪽에서 그 경우 메시지 전송 자체를 하지
// 않거나(ready) '*'로 대체한다(height, 기존 동작 유지 목적).
function getParentOrigin() {
  try {
    if (!document.referrer) return null;
    var refOrigin = new URL(document.referrer).origin;
    return PARENT_ALLOWED_ORIGINS.indexOf(refOrigin) !== -1 ? refOrigin : null;
  } catch (e) {
    return null;
  }
}

// ready 메시지는 부모 origin을 안전하게 확인했을 때만 보낸다 — 확인이
// 안 되면(referrer 없음 등) 아예 보내지 않는다('*'로 대신 보내지 않음).
function notifyParentReady() {
  var origin = getParentOrigin();
  if (!origin) return;
  try {
    window.parent.postMessage({ source: '730-skin-check', type: 'ready' }, origin);
  } catch (e) {}
}

// sessionStorage에 저장된 언어를 먼저 적용해 첫 렌더부터 맞는 언어로
// 그린다(부모의 language-change 메시지를 기다리는 동안 한국어가 잠깐
// 보였다가 바뀌는 현상을 피한다). 그 다음 부모에게 ready를 보내 실제
// 최신 언어를 다시 받는다.
currentLang = readStoredLang();
buildForm();
setupGenderToggle();
applyTranslations();
document.getElementById('calc-btn').addEventListener('click', calculate);
notifyParentReady();
</script><script>
document.getElementById('calc-btn').addEventListener('click', function() {
  gtag('event', 'check_complete', {
    event_category: 'engagement',
    event_label: '결과확인버튼클릭'
  });
});
</script>
<script>
// iframe으로 이 페이지를 감싸는 부모 문서(730skin-check 이어밸런스체크 라우트)에
// 실제 콘텐츠 높이를 알려준다. postMessage는 origin이 달라도(cross-origin) 항상
// 동작해서, 로컬 개발 서버처럼 부모와 origin이 다른 환경에서도 iframe 높이가
// 정확히 맞춰진다.
(function () {
  function reportHeight() {
    // documentElement.scrollHeight는 "콘텐츠 높이와 뷰포트 높이 중 큰 값"을
    // 반환한다. 이전 페이지(체크리스트)에서 이미 iframe이 크게 늘어난 상태로
    // 이 페이지로 넘어오면, 뷰포트 자체가 커서 실제 콘텐츠보다 큰 값을 그대로
    // 돌려주는 문제가 있다. body.scrollHeight는 뷰포트 크기와 무관하게 실제
    // 콘텐츠 높이만 반영하므로 이 문제가 없다.
    // targetOrigin은 가능하면 getParentOrigin()(위 스크립트에서 정의, 같은
    // 문서라 전역에서 접근 가능)으로 확인한 안전한 부모 origin을 쓰고,
    // 확인이 안 되는 경우에만 기존처럼 '*'로 대체해 높이 조절 기능 자체는
    // 계속 동작하게 한다.
    var targetOrigin = (typeof getParentOrigin === 'function' && getParentOrigin()) || '*';
    window.parent.postMessage({
      source: '730skin-check-embed',
      height: document.body.scrollHeight
    }, targetOrigin);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    window.addEventListener('load', reportHeight);
  }
  reportHeight();
})();
</script>
