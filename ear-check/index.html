<script>
// ============================================================

function readStoredLang() {
  try {
    var v = sessionStorage.getItem(LANG_KEY);
    return (v === 'ko' || v === 'en') ? v : 'ko';
  } catch (e) {
    return 'ko';
  }
}

function storeLang(lang) {
  try { sessionStorage.setItem(LANG_KEY, lang); } catch (e) {}
}

function domainLabel(key) {
  return currentLang === 'en' ? EN.domainLabels[key] : KO_DOMAIN_LABEL[key];
}

function itemText(id) {
  return currentLang === 'en' ? EN.items[id] : KO_ITEM_TEXT[id];
}

function optsText() {
  return currentLang === 'en' ? EN.opts : OPTS;
}

function cycleOptsText() {
  return currentLang === 'en' ? EN.cycleOpts : CYCLE_OPTS;
}

function domainNote(key) {
  if (currentLang === 'en') return EN.domainNotes ? EN.domainNotes[key] : undefined;
  var domain = DOMAINS.filter(function (d) { return d.key === key; })[0];
  return domain ? domain.note : undefined;
}

function lifestyleLabel(key) {
  return currentLang === 'en' ? EN.lifestyleItems[key] : (LIFESTYLE_ITEMS.filter(function (it) { return it.key === key; })[0] || {}).label;
}

function setText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// 화면에 보이는 고정 문구(라벨/버튼/안내)를 현재 언어로 갱신한다. 문항/도메인
// 제목은 buildForm()이 만들어둔 data-item-id/data-domain-key로 찾아
// textContent만 바꾸므로, 체크된 답변(active 클래스)이나 입력 중인
// 이름·나이·날짜·성별 값은 전혀 건드리지 않는다(요소를 다시 만들지 않음).

  setText('page-desc', currentLang === 'en' ? EN.heroDesc : '최근 7일 동안 경험한 정도에 가장 가까운 답을 선택해주세요');
  setText('gender-label', currentLang === 'en' ? EN.genderLabel : '성별');
  setText('name-label', currentLang === 'en' ? EN.nameLabel : '이름');
  setText('age-label', currentLang === 'en' ? EN.ageLabel : '나이');
  setText('date-label', currentLang === 'en' ? EN.dateLabel : '상담 날짜');

function setLanguage(lang) {
  if (lang !== 'ko' && lang !== 'en') lang = 'ko';
  currentLang = lang;
  storeLang(lang);
  applyTranslations();

var answers = {};
// data-item-id 문항 행을 매번 querySelector로 다시 찾지 않도록 캐싱해둔다.
// updateProgress()/focusFirstUnanswered()에서 반복 조회된다.
var itemRows = {};
// 성별을 여성으로 선택했을 때만 주기 확인 질문이 노출되고, 그 질문에서
// '확인할게요'를 선택했을 때만 주기 문항이 노출·필수화된다.
var cycleChoice = null; // null | 'yes' | 'no'

function buildForm() {
  var formArea = document.getElementById('form-area');
  DOMAINS.forEach(function(d) {
    var section = document.createElement('div');
    section.className = 'domain';
    section.setAttribute('data-domain-key', d.key);
    var h = document.createElement('h2');
    h.textContent = domainLabel(d.key);
    section.appendChild(h);

    if (d.note) {
      var noteEl = document.createElement('p');
      noteEl.className = 'domain-note';
      noteEl.textContent = domainNote(d.key);
      section.appendChild(noteEl);
    }

    d.items.forEach(function(pair) {
      var itemId = pair[0];
      // 모든 문항은 처음에 아무 선택지도 활성화하지 않은 미응답(null)
      // 상태로 시작한다.
      answers[itemId] = null;

      var row = document.createElement('div');
      row.className = 'item-row unanswered';
      row.setAttribute('data-item-id', itemId);
      row.setAttribute('data-scale', d.scale === 'cycle' ? 'cycle' : 'default');
      itemRows[itemId] = row;

      var label = document.createElement('div');
      label.className = 'item-label';
      label.textContent = itemText(itemId);
      row.appendChild(label);

      var btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';
      btnGroup.setAttribute('data-item', itemId);

      (d.scale === 'cycle' ? cycleOptsText() : optsText()).forEach(function(optText, idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';
        btn.textContent = optText;
        btn.addEventListener('click', function() {
          answers[itemId] = idx;
          var siblings = btnGroup.querySelectorAll('.opt-btn');
          for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('active');
          btn.classList.add('active');
          row.classList.remove('unanswered');
          updateProgress();
        });
        btnGroup.appendChild(btn);
      });

      row.appendChild(btnGroup);
      section.appendChild(row);
    });

    if (d.conditional) {
      section.id = 'domain-' + d.key;
      section.style.display = 'none';
    }

    formArea.appendChild(section);
  });

  buildLifestyleSection(formArea);
  updateProgress();
}

// 생활관리 확인 영역 — 점수에 포함되지 않는 별도 복수 선택 목록.
// '아직 나에게 맞는 방법을 찾지 못함'은 다른 모든 항목과 상호 배타적이고,
// '기타'는 선택 시에만 자유 입력창을 보여준다.
function buildLifestyleSection(formArea) {
  var section = document.createElement('div');
  section.className = 'lifestyle-section';

  var h = document.createElement('h2');
  h.id = 'lifestyle-title';
  h.textContent = currentLang === 'en' ? EN.lifestyleTitle : '생활관리 확인';
  section.appendChild(h);

  var desc = document.createElement('p');
  desc.className = 'lifestyle-desc';
  desc.id = 'lifestyle-desc';
  desc.textContent = currentLang === 'en' ? EN.lifestyleDesc : '최근 일주일 동안 실천한 방법을 모두 선택해주세요 (점수에는 포함되지 않아요)';
  section.appendChild(desc);

  var optionsWrap = document.createElement('div');
  optionsWrap.className = 'lifestyle-options';

  var otherInput = document.createElement('input');
  otherInput.type = 'text';
  otherInput.className = 'lifestyle-other-input';
  otherInput.id = 'lifestyle-other-input';
  otherInput.maxLength = 80;
  otherInput.placeholder = currentLang === 'en' ? EN.lifestyleOtherPlaceholder : '내용을 입력해주세요';

  LIFESTYLE_ITEMS.forEach(function (item) {
    var label = document.createElement('label');
    label.className = 'lifestyle-opt';
    label.setAttribute('data-lifestyle-key', item.key);

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = 'lifestyle-' + item.key;

    var span = document.createElement('span');
    span.className = 'lifestyle-opt-text';
    span.textContent = lifestyleLabel(item.key);

    checkbox.addEventListener('change', function () {
      label.classList.toggle('checked', checkbox.checked);

      if (item.exclusive && checkbox.checked) {
        LIFESTYLE_ITEMS.forEach(function (other) {
          if (other.key === item.key) return;
          var otherBox = document.getElementById('lifestyle-' + other.key);
          if (otherBox && otherBox.checked) {
            otherBox.checked = false;
            otherBox.dispatchEvent(new Event('change'));
          }
        });
      } else if (!item.exclusive && checkbox.checked) {
        var noneBox = document.getElementById('lifestyle-none');
        if (noneBox && noneBox.checked) {
          noneBox.checked = false;
          noneBox.dispatchEvent(new Event('change'));
        }
      }

      if (item.hasInput) {
        otherInput.classList.toggle('is-visible', checkbox.checked);
        if (!checkbox.checked) otherInput.value = '';
      }
    });

    label.appendChild(checkbox);
    label.appendChild(span);
    optionsWrap.appendChild(label);
  });

  section.appendChild(optionsWrap);
  section.appendChild(otherInput);
  formArea.appendChild(section);
}

// 주기 전후 컨디션 문항(36~43)의 응답과 화면 표시를 모두 초기화한다.
// 성별을 남성으로 바꾸거나, 주기 확인 질문에서 '확인하지 않을게요'를
// 선택하면 호출된다.
function resetCycleAnswers() {
  var cycleDomain = DOMAINS.filter(function (d) { return d.key === 'cycle'; })[0];
  cycleDomain.items.forEach(function (pair) {
    answers[pair[0]] = null;
    var row = itemRows[pair[0]];
    if (row) {
      row.classList.add('unanswered');
      row.querySelectorAll('.opt-btn').forEach(function (b) { b.classList.remove('active'); });
    }
  });
}

function setCycleItemsVisible(visible) {
  var section = document.getElementById('domain-cycle');
  if (section) section.style.display = visible ? 'block' : 'none';
  if (!visible) resetCycleAnswers();
}

function setCycleQuestionVisible(visible) {
  var q = document.getElementById('cycle-question');
  if (q) q.classList.toggle('is-visible', visible);
  if (!visible) {
    document.querySelectorAll('#cycle-toggle-group .opt-btn').forEach(function (b) { b.classList.remove('active'); });
    cycleChoice = null;
    setCycleItemsVisible(false);
  }
}

function setupCycleToggle() {
  var group = document.getElementById('cycle-toggle-group');
  if (!group) return;
  var btns = group.querySelectorAll('.opt-btn');
  btns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      btns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      cycleChoice = btn.getAttribute('data-cycle');
      setCycleItemsVisible(cycleChoice === 'yes');
      updateProgress();
    });
  });
}

function setupGenderToggle() {
  var genderGroup = document.getElementById('gender-group');
  if (!genderGroup) return;
  var genderBtns = genderGroup.querySelectorAll('.opt-btn');

  genderBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      for (var i = 0; i < genderBtns.length; i++) genderBtns[i].classList.remove('active');
      btn.classList.add('active');

      var isFemale = btn.getAttribute('data-gender') === 'female';
      // 남성으로 바뀌면(혹은 처음부터 남성이면) 주기 확인 질문과 주기
      // 문항을 모두 숨기고, 이미 답한 주기 문항 응답도 제거한다.
      setCycleQuestionVisible(isFemale);
      updateProgress();
    });
  });
}

// 현재 화면에 표시된 모든 점수 문항 id를 순서대로 모은다. 주기 전후
// 컨디션 문항(cycle)은 '확인할게요'를 선택했을 때만 포함된다. 진행률
// 계산과 미응답 이동 모두 이 목록을 기준으로 동작한다.
function getRequiredItemIds() {
  var ids = [];
  DOMAINS.forEach(function(d) {
    if (d.key === 'cycle' && cycleChoice !== 'yes') return;
    d.items.forEach(function(pair) { ids.push(pair[0]); });
  });
  return ids;
}

function isAnswered(id) {
  return answers[id] !== null && answers[id] !== undefined;
}

// '응답 완료 X / 전체 Y' 및 미응답 개수 표시, 결과 버튼의 비활성 스타일,
// 각 문항 행의 미응답 테두리 표시를 모두 이 함수 하나로 갱신한다.
function updateProgress() {
  var required = getRequiredItemIds();
  var answeredCount = 0;
  required.forEach(function(id) {
    var answered = isAnswered(id);
    if (answered) answeredCount++;
    var row = itemRows[id];
    if (row) row.classList.toggle('unanswered', !answered);
  });

  var remaining = required.length - answeredCount;

  setText('progress-text', currentLang === 'en'
    ? EN.progressText(answeredCount, required.length)
    : ('응답 완료 ' + answeredCount + ' / ' + required.length));

  setText('unanswered-text', remaining > 0
    ? (currentLang === 'en' ? EN.unansweredText(remaining) : ('미응답 ' + remaining + '문항'))
    : '');

  var calcBtn = document.getElementById('calc-btn');
  if (calcBtn) calcBtn.classList.toggle('is-disabled', remaining > 0);
}

// 미응답 문항이 있으면 첫 번째 문항으로 스크롤·포커스 이동하고 true를
// 반환한다(이 경우 호출한 쪽에서 결과 계산을 진행하지 않는다).
function focusFirstUnanswered() {
  var required = getRequiredItemIds();
  for (var i = 0; i < required.length; i++) {
    if (isAnswered(required[i])) continue;
    var row = itemRows[required[i]];
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.remove('flash-highlight');
      void row.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
      row.classList.add('flash-highlight');
      var firstBtn = row.querySelector('.opt-btn');
      if (firstBtn) firstBtn.focus();
    }
    return true;
  }
  return false;
}

function onCalcClick() {
  if (focusFirstUnanswered()) return;
  calculate();
}

// 전체 점수(0~105점) 구간 — 의학적 진단 기준이 아니라 730스킨 상담을
// 위한 임시 운영 기준이다. 화면 안내에도 동일한 문구를 표시한다.
function overallTier(total) {
  if (total <= 26) return 0;
  if (total <= 52) return 1;
  if (total <= 78) return 2;
  return 3;
}

// 채점 로직 — 7개 핵심 영역(0~105점)과 주기 전후 컨디션(0~24점, 전체
// 점수 제외)을 완전히 분리해서 계산한다.
function calculate() {
  var resultsData = [];

  DOMAINS.forEach(function(d) {
    if (d.key === 'cycle') return; // 주기 영역은 전체 점수·영역 비교에서 제외

    var sum = 0;
    d.items.forEach(function(pair) { sum += answers[pair[0]]; });
    var maxScore = d.items.length * MAX_SCORE;
    // 회복 리듬(reverse)은 응답이 긍정적일수록(=거의 매일 있었다) 점수가
    // 낮아지도록 반전한다 — 모든 영역이 "점수가 높을수록 휴식·회복이
    // 더 필요하다"는 같은 방향을 갖게 하기 위함이다.
    var scoredSum = d.reverse ? (maxScore - sum) : sum;
    // 영역마다 문항 수·최고점이 달라 단순 합계로는 비교할 수 없으므로,
    // 0~100 환산 점수(pct)를 별도로 계산해 영역 간 비교에 사용한다.
    var pct = Math.round((scoredSum / maxScore) * 1000) / 10;

    resultsData.push({ domainKey: d.key, sum: scoredSum, max: maxScore, pct: pct });
  });

  var totalScore = resultsData.reduce(function(acc, r) { return acc + r.sum; }, 0);

  // '조금 더 살펴볼 영역' — 환산 점수 최댓값을 가진 영역(들). 전부 0점이면
  // 특정 영역을 강조하지 않는다(빈 배열 → result.html에서 안내 문구로 대체).
  var maxPct = Math.max.apply(null, resultsData.map(function(r) { return r.pct; }));
  var highlightDomains = maxPct === 0
    ? []
    : resultsData.filter(function(r) { return r.pct === maxPct; }).map(function(r) { return r.domainKey; });

  // 전체 상위 응답 문항 최대 3개 — 점수(우려 방향으로 정렬된 값) 내림차순,
  // 0점 문항은 제외, 동점이면 원래 문항 순서(id 오름차순) 유지.
  var itemScores = [];
  DOMAINS.forEach(function(d) {
    if (d.key === 'cycle') return;
    d.items.forEach(function(pair) {
      var raw = answers[pair[0]];
      var score = d.reverse ? (MAX_SCORE - raw) : raw;
      itemScores.push({ id: pair[0], domainKey: d.key, score: score });
    });
  });
  var topItems = itemScores.filter(function(it) { return it.score > 0; })
    .sort(function(a, b) { return b.score - a.score; })
    .slice(0, 3);
  var topItemIds = topItems.map(function(it) { return it.id; });

  // 영역별 상위 문항(최대 2개) — result.html에서 "조금 더 살펴볼 영역"의
  // 결과 문구에 구체적으로 어떤 문항이 높았는지 언급하기 위해 사용한다.
  var domainTopItems = {};
  DOMAINS.forEach(function(d) {
    if (d.key === 'cycle') return;
    var scores = d.items.map(function(pair) {
      var raw = answers[pair[0]];
      return { id: pair[0], score: d.reverse ? (MAX_SCORE - raw) : raw };
    }).filter(function(it) { return it.score > 0; })
      .sort(function(a, b) { return b.score - a.score; })
      .slice(0, 2);
    domainTopItems[d.key] = scores.map(function(it) { return it.id; });
  });

  // 생리 전후 컨디션 — cycleChoice가 'yes'일 때만 계산·저장한다. cycleSum은
  // 내부 계산·테스트 확인용으로만 저장하고, 고객 결과 화면에는 점수나
  // 등급을 표시하지 않는다. 문항 원문을 그대로 나열하지 않고, 6개 변화
  // 유형(CYCLE_THEMES)별 최고 응답 점수(0~3)만 저장해 result.html이
  // 유형 단위로 해석하도록 한다 — 점수 0이면 result.html에서 표시하지
  // 않는다. overallMaxScore(전체 8문항 중 최고 응답 점수)는 전체 요약
  // 문구를 고를 때 쓰인다.
  var cycleDomain = DOMAINS.filter(function(d) { return d.key === 'cycle'; })[0];
  var cycleIncluded = cycleChoice === 'yes';
  var cycleSum = 0;
  var cycleThemeScores = {};
  var cycleOverallMaxScore = 0;
  if (cycleIncluded) {
    cycleDomain.items.forEach(function(pair) {
      cycleSum += answers[pair[0]];
    });
    CYCLE_THEMES.forEach(function(theme) {
      var themeMax = 0;
      theme.items.forEach(function(itemId) {
        var raw = answers[itemId];
        if (raw > themeMax) themeMax = raw;
        if (raw > cycleOverallMaxScore) cycleOverallMaxScore = raw;
      });
      cycleThemeScores[theme.key] = themeMax;
    });
  }

  var lifestyleSelected = [];
  LIFESTYLE_ITEMS.forEach(function(item) {
    var cb = document.getElementById('lifestyle-' + item.key);
    if (cb && cb.checked) lifestyleSelected.push(item.key);
  });
  var lifestyleOtherText = '';
  if (lifestyleSelected.indexOf('other') !== -1) {
    var otherInput = document.getElementById('lifestyle-other-input');
    lifestyleOtherText = otherInput ? otherInput.value.trim() : '';
  }

  var payload = {
    name: document.getElementById('name').value,
    age: document.getElementById('age').value,
    date: document.getElementById('date').value,
    results: resultsData,
    totalScore: totalScore,
    overallTierIdx: overallTier(totalScore),
    highlightDomains: highlightDomains,
    topItemIds: topItemIds,
    domainTopItems: domainTopItems,
    cycleCheck: { included: cycleIncluded, sum: cycleSum, themeScores: cycleThemeScores, overallMaxScore: cycleOverallMaxScore },
    lifestyleSelected: lifestyleSelected,
    lifestyleOtherText: lifestyleOtherText
  };
  sessionStorage.setItem('earCheckResult', JSON.stringify(payload));
  storeLang(currentLang);
  location.href = 'result.html';
}

// ── 부모(메인 사이트)와의 언어 동기화 ──
// event.origin과 event.source를 둘 다 확인해, 메인 사이트가 아닌 다른
// 곳에서 온 message는 전부 무시한다. language 값도 'ko'/'en' 화이트리스트
// 밖이면 버린다.
window.addEventListener('message', function (event) {
  if (PARENT_ALLOWED_ORIGINS.indexOf(event.origin) === -1) return;
  if (event.source !== window.parent) return;
  var data = event.data;
  if (!data || data.source !== '730-main-site' || data.type !== 'language-change') return;
  if (data.language !== 'ko' && data.language !== 'en') return;
  setLanguage(data.language);
});

// document.referrer는 이 문서를 iframe으로 띄운 부모 페이지의 주소다(같은
// 값이 페이지 로드 내내 바뀌지 않으므로 한 번만 계산해도 된다). 그 origin이
// PARENT_ALLOWED_ORIGINS 화이트리스트에 있을 때만 "안전하게 확인됨"으로
// 본다 — referrer가 없거나(리퍼러 정책 등으로 비어있는 경우) 화이트리스트
// 밖이면 null을 돌려주고, 호출하는 쪽에서 그 경우 메시지 전송 자체를 하지
// 않거나(ready) '*'로 대체한다(height, 기존 동작 유지 목적).
function getParentOrigin() {
  try {
    if (!document.referrer) return null;
    var refOrigin = new URL(document.referrer).origin;
    return PARENT_ALLOWED_ORIGINS.indexOf(refOrigin) !== -1 ? refOrigin : null;
  } catch (e) {
    return null;
  }
}

// ready 메시지는 부모 origin을 안전하게 확인했을 때만 보낸다 — 확인이
// 안 되면(referrer 없음 등) 아예 보내지 않는다('*'로 대신 보내지 않음).
function notifyParentReady() {
  var origin = getParentOrigin();
  if (!origin) return;
  try {
    window.parent.postMessage({ source: '730-skin-check', type: 'ready' }, origin);
  } catch (e) {}
}

// sessionStorage에 저장된 언어를 먼저 적용해 첫 렌더부터 맞는 언어로
// 그린다(부모의 language-change 메시지를 기다리는 동안 한국어가 잠깐
// 보였다가 바뀌는 현상을 피한다). 그 다음 부모에게 ready를 보내 실제
// 최신 언어를 다시 받는다.
currentLang = readStoredLang();
buildForm();
setupGenderToggle();
setupCycleToggle();
applyTranslations();
document.getElementById('calc-btn').addEventListener('click', onCalcClick);
notifyParentReady();
</script><script>
document.getElementById('calc-btn').addEventListener('click', function() {
  gtag('event', 'check_complete', {
    event_category: 'engagement',
    event_label: '결과확인버튼클릭'
  });
});
</script>
<script>
// iframe으로 이 페이지를 감싸는 부모 문서(730skin-check 이어밸런스체크 라우트)에
// 실제 콘텐츠 높이를 알려준다. postMessage는 origin이 달라도(cross-origin) 항상
// 동작해서, 로컬 개발 서버처럼 부모와 origin이 다른 환경에서도 iframe 높이가
// 정확히 맞춰진다.
(function () {
  function reportHeight() {
    // documentElement.scrollHeight는 "콘텐츠 높이와 뷰포트 높이 중 큰 값"을
    // 반환한다. 이전 페이지(체크리스트)에서 이미 iframe이 크게 늘어난 상태로
    // 이 페이지로 넘어오면, 뷰포트 자체가 커서 실제 콘텐츠보다 큰 값을 그대로
    // 돌려주는 문제가 있다. body.scrollHeight는 뷰포트 크기와 무관하게 실제
    // 콘텐츠 높이만 반영하므로 이 문제가 없다.
    // targetOrigin은 가능하면 getParentOrigin()(위 스크립트에서 정의, 같은
    // 문서라 전역에서 접근 가능)으로 확인한 안전한 부모 origin을 쓰고,
    // 확인이 안 되는 경우에만 기존처럼 '*'로 대체해 높이 조절 기능 자체는
    // 계속 동작하게 한다.
    var targetOrigin = (typeof getParentOrigin === 'function' && getParentOrigin()) || '*';
    window.parent.postMessage({
      source: '730skin-check-embed',
      height: document.body.scrollHeight
    }, targetOrigin);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    window.addEventListener('load', reportHeight);
  }
  reportHeight();
})();
</script>
