<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>730스킨 이어밸런스 체크 결과지</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: #FFFFFF;
    color: #2E2A26;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; position: relative; }
  .home-link {
    position: absolute; top: 0; left: 0;
    font-size: 15px; font-weight: 700; color: #2E2A26;
    text-decoration: none; letter-spacing: 0.5px;
  }
  .home-link:hover { color: #B08D57; }
  header { text-align: center; margin-bottom: 24px; }
  header .sub { color: #B08D57; font-size: 13px; letter-spacing: 1px; margin-bottom: 4px; }
  header h1 { font-size: 22px; margin: 0 0 8px; color: #2E2A26; }
  header p { font-size: 13px; color: #8A8378; margin: 0; }

  .info-summary {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    background: #fff; border: 1px solid #E6DFD2; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13.5px; color: #6B6559;
  }
  .info-summary span b { color: #2E2A26; }

  .tier-stable { background: #E5EEE1; color: #4B6E3F; }
  .tier-watch { background: #FBEED9; color: #A0722C; }
  .tier-focus { background: #F6DFD5; color: #B04B2A; }
  .tier-critical { background: #F6D5D5; color: #9C2F2F; }

  .overall-block { background: #fff; border: 1px solid #E6DFD2; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .overall-score-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .overall-score { font-size: 26px; font-weight: 700; color: #2E2A26; }
  .overall-score .overall-max { font-size: 13px; font-weight: 400; color: #8A8378; }
  .overall-title { font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 20px; }
  .overall-temp-note { font-size: 11px; color: #B0A896; margin-top: 8px; }

  .domain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .domain-card { background: #fff; border: 1px solid #E6DFD2; border-radius: 10px; padding: 10px 12px; }
  .domain-card.is-highlight { border-color: #CDB6A3; background: #FBF3EC; }
  .domain-card .dc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 6px; }
  .domain-card .dc-name { font-size: 12.5px; font-weight: 700; color: #2E2A26; }
  .domain-card .dc-pct { font-size: 12px; font-weight: 700; color: #7A5C3E; }
  .domain-card .dc-bar-track { background: #F1ECE3; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 6px; }
  .domain-card .dc-bar-fill { background: #CDB6A3; height: 100%; border-radius: 6px; }
  .domain-card.is-highlight .dc-bar-fill { background: #7A5C3E; }
  .domain-card .dc-score { font-size: 11px; color: #8A8378; }
  .domain-card .dc-badge { display: inline-block; font-size: 10px; font-weight: 700; color: #7A5C3E; margin-top: 4px; }

  /* 새 11단계 상세 결과 공통 카드 — 제목/짧은 문단/목록으로만 구성한다 */
  .section-card { background: #fff; border: 1px solid #E6DFD2; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .section-card.emphasis { background: #FBF3EC; border-color: #CDB6A3; }
  .section-card .step-title { font-size: 14px; font-weight: 700; color: #7A5C3E; margin: 0 0 10px; }
  .section-card p { font-size: 13px; color: #3A3530; line-height: 1.65; margin: 0 0 8px; }
  .section-card p:last-child { margin-bottom: 0; }
  .section-card .muted-note { font-size: 12.5px; color: #8A8378; margin: 0; }
  .section-card ol, .section-card ul.plain-list {
    margin: 0; padding-left: 18px; font-size: 13px; color: #3A3530; line-height: 1.7;
  }

  .area-card-group { display: flex; flex-direction: column; gap: 10px; }
  .area-card { background: #FBF8F2; border: 1px solid #E6DFD2; border-radius: 10px; padding: 12px 14px; }
  .area-card h3 { font-size: 13px; font-weight: 700; color: #2E2A26; margin: 0 0 6px; }
  .area-card p { font-size: 12.5px; color: #3A3530; line-height: 1.6; margin: 0 0 6px; }
  .area-card p:last-child { margin-bottom: 0; }
  .cycle-theme-tier { font-size: 11px; font-weight: 700; color: #7A5C3E; margin: -2px 0 6px; }

  .connection-text {
    background: #FBF8F2; border: 1px solid #E6DFD2; border-radius: 10px;
    padding: 12px 14px; margin-top: 10px;
  }
  .connection-text p { font-size: 13px; color: #3A3530; line-height: 1.65; margin: 0 0 6px; }
  .connection-text p:last-child { margin-bottom: 0; }

  .plan-list { list-style: none; margin: 0; padding: 0; }
  .plan-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid #EFE3D6; }
  .plan-item:first-child { border-top: none; padding-top: 0; }
  .plan-checkbox { font-size: 16px; line-height: 1.4; color: #7A5C3E; flex-shrink: 0; }
  .plan-body .plan-text { font-size: 13.5px; color: #2E2A26; line-height: 1.55; }
  .plan-body .plan-reason { font-size: 12px; color: #8A8378; margin-top: 3px; }

  .lifestyle-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .lifestyle-tag {
    display: inline-block; font-size: 12px; padding: 5px 10px; border-radius: 14px;
    background: #E8D8C9; color: #6E4933; font-weight: 600;
  }

  .safety-block {
    font-size: 11.5px; color: #8A8378; line-height: 1.6; margin: 16px 0;
    padding-top: 10px; border-top: 1px dashed #E6DFD2;
  }
  .safety-block p { margin: 0 0 6px; }
  .safety-block p:last-child { margin-bottom: 0; }

  .action-row { display: flex; gap: 8px; margin-top: 16px; }
  .print-btn, .back-btn {
    display: block; width: 100%; text-align: center; padding: 10px;
    background: #fff; border: 1px solid #DDD5C7; border-radius: 8px; color: #6B6559;
    font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: none;
  }
  .print-btn {
    background: #FFFFFF; color: #1F1F1F; border-color: #D9D1C7; font-weight: 700;
    border-radius: 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    transition: box-shadow 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
  }
  .print-btn:hover { background: #FAF8F5; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.09); transform: translateY(-1px); }

  .empty-state { text-align: center; color: #8A8378; font-size: 14px; margin-top: 60px; }
  .empty-state a { color: #B08D57; }

  footer { text-align: center; font-size: 11px; color: #B0A896; margin-top: 30px; }

  @media (max-width: 600px) {
    .domain-grid { grid-template-columns: 1fr; }
  }

  @media print {
    .action-row, .home-link { display: none; }
    body { background: #fff; }
    .overall-block, .domain-card, .section-card, .area-card, .plan-item, .connection-text {
      page-break-inside: avoid;
      break-inside: avoid;
    }
  }
</style>
</head>

<div class="wrap">

// 생활관리 key + 영역 key 조합일 때 해당 영역 actions 배열에서 우선
// 선택할 인덱스. lifestyleLinks.examples에 문구가 있는 5개 조합만
// 지정돼 있고, 나머지 조합은 매핑이 없어 기본 순서(0번부터)로 선택된다.
var LIFESTYLE_ACTION_PRIORITY = {
  sleep: { hobby: 2 },
  tension: { walk: 1 },
  mind: { talk: 2 },
  burden: { alone: 4 },
  breathing: { stretch: 0 }
};

var ALL_DOMAIN_KEYS = ['sleep', 'burden', 'recovery', 'tension', 'breathing', 'digestion', 'mind'];

function readStoredLang() {
  try {
    var v = sessionStorage.getItem(LANG_KEY);
    return (v === 'ko' || v === 'en') ? v : 'ko';
  } catch (e) {
    return 'ko';
  }
}

function dict() {
  return currentLang === 'en' ? EN : KO;
}

function setText(id, text) {
  var el = document.getElementById(id);

}

function makeSectionCard(emphasis) {

  card.className = 'section-card' + (emphasis ? ' emphasis' : '');

}

function addStepTitle(card, text) {

  h2.className = 'step-title';
  h2.textContent = text;
  card.appendChild(h2);
}

function addParagraph(card, text, className) {
  var p = document.createElement('p');
  if (className) p.className = className;
  p.textContent = text;
  card.appendChild(p);
}

// 결과 화면 전체를 다시 그린다. 이 페이지에는 사용자가 입력 중인 값이
// 없고(전부 index.html에서 이미 제출된 값을 표시만 함) 버튼도 매번
// 새로 이벤트를 붙이므로, 언어가 바뀔 때 통째로 다시 그려도 상태가
// 유실될 게 없다. 이름/나이/날짜/결과 문구는 전부 textContent로만
// 채워 innerHTML에 사용자 입력이 들어가지 않게 한다.
function renderResult() {
  var d = dict();
  var contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  var raw = sessionStorage.getItem('earCheckResult');
  if (!raw) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.appendChild(document.createTextNode(d.emptyMessage));
    empty.appendChild(document.createElement('br'));
    var link = document.createElement('a');
    link.href = 'index.html';
    link.textContent = d.emptyLinkText;
    empty.appendChild(link);
    contentEl.appendChild(empty);
    return;
  }

  var data = JSON.parse(raw);
  var plan = computeAreaPlan(data);

  var summary = document.createElement('div');
  summary.className = 'info-summary';
  var summaryFields = [
    { label: d.nameLabel, value: data.name },
    { label: d.ageLabel, value: data.age },
    { label: d.dateLabel, value: data.date }
  ];
  var hasSummary = false;
  summaryFields.forEach(function (field) {
    if (!field.value) return;
    hasSummary = true;
    var span = document.createElement('span');
    span.appendChild(document.createTextNode(field.label + ': '));
    var b = document.createElement('b');
    b.textContent = field.value;
    span.appendChild(b);
    summary.appendChild(span);
  });
  if (hasSummary) contentEl.appendChild(summary);

  // 점수표(전체 점수 + 7개 영역 막대)는 그대로 유지
  contentEl.appendChild(buildOverallBlock(data, d));
  contentEl.appendChild(buildDomainGrid(data, d, plan));

  // 1~9단계 상세 결과 (모든 영역 0점이면 3~9단계는 표시하지 않음)
  contentEl.appendChild(buildStep1(data, d));
  contentEl.appendChild(buildStep2(data, d));
  buildStep3And4(data, d, plan).forEach(function (el) { contentEl.appendChild(el); });
  var step5 = buildStep5(data, d);
  if (step5) contentEl.appendChild(step5);
  contentEl.appendChild(buildStep6(data, d, plan));
  var step7 = buildStep7(data, d, plan);
  if (step7) contentEl.appendChild(step7);
  var step8 = buildStep8(data, d, plan);
  if (step8) contentEl.appendChild(step8);
  var step9 = buildStep9(data, d, plan);
  if (step9) contentEl.appendChild(step9);

  // 10단계: 주기 전후 컨디션 (확인한 경우만)
  if (data.cycleCheck && data.cycleCheck.included) contentEl.appendChild(buildCycleBlock(data, d));

  // 11단계: 안전 안내
  contentEl.appendChild(buildSafetyBlock(d));

  var actionRow = document.createElement('div');
  actionRow.className = 'action-row';

  var printBtn = document.createElement('button');
  printBtn.className = 'print-btn';
  printBtn.type = 'button';
  printBtn.textContent = d.printBtn;
  printBtn.addEventListener('click', function () { window.print(); });
  actionRow.appendChild(printBtn);

  var retestBtn = document.createElement('button');
  retestBtn.className = 'back-btn';
  retestBtn.type = 'button';
  retestBtn.textContent = d.retestBtn;
  retestBtn.addEventListener('click', function () {
    if (!window.confirm(d.retestConfirm)) return;
    try { sessionStorage.removeItem('earCheckResult'); } catch (e) {}
    location.href = 'index.html';
  });
  actionRow.appendChild(retestBtn);

  contentEl.appendChild(actionRow);
}

// ============================================================
// 영역 조합 판정 — highlightDomains.length로 4가지 모드를 나눈다.
//   none  : 전 영역 0점 (highlightDomains가 비어 있음)
//   single: 단독 1위 1개. 나머지 중 최댓값(second)이 35% 이상이면 연결,
//           미만이면 '다른 영역은 편안한 흐름' 문구
//   pair  : 공동 1위 정확히 2개 — 두 영역을 동급으로 표시
//   many  : 공동 1위 3개 이상 — 순위를 매기지 않고 전부 표시,
//           7일 행동/상담질문/비교항목은 topItemIds가 속한 영역 기준
// ============================================================
function computeAreaPlan(data) {
  var hd = data.highlightDomains || [];
  if (hd.length === 0) return { mode: 'none' };

  if (hd.length === 1) {
    var top = hd[0];
    var second = null;
    data.results.forEach(function (r) {
      if (r.domainKey === top) return;
      if (!second || r.pct > second.pct) second = r;
    });
    if (second && second.pct >= 35) {
      return { mode: 'single', top: top, second: second.domainKey };
    }
    return { mode: 'single', top: top, second: null };
  }

  if (hd.length === 2) {
    return { mode: 'pair', domains: hd.slice() };
  }

  // 공동 1위 3개 이상 — topItemIds가 속한 영역을 최대 2개까지 뽑아
  // 7일 행동/상담질문/비교항목에 쓴다(도메인 자체에 순위를 매기지 않기
  // 위함).
  var focusDomains = [];
  (data.topItemIds || []).forEach(function (id) {
    var domainKey = findDomainKeyForItem(id);
    if (domainKey && focusDomains.indexOf(domainKey) === -1) focusDomains.push(domainKey);
  });
  return { mode: 'many', domains: hd.slice(), focusDomains: focusDomains.slice(0, 2) };
}

// domainTopItems(영역별 상위 문항 id 목록)을 뒤져 문항 id가 속한 영역
// key를 찾는다. index.html의 DOMAINS 구조를 다시 정의하지 않기 위해
// 저장된 domainTopItems/데이터만으로 역추적한다.
function findDomainKeyForItem(itemId) {
  var domainRanges = {
    sleep: [1, 4], burden: [5, 10], recovery: [11, 15], tension: [16, 20],
    breathing: [21, 25], digestion: [26, 30], mind: [31, 35]
  };
  for (var key in domainRanges) {
    if (itemId >= domainRanges[key][0] && itemId <= domainRanges[key][1]) return key;
  }
  return null;
}

function getPairText(d, a, b) {
  var key = pairKey(a, b);
  return d.pairText[key] || [d.interactionFallback];
}

// 전체 점수(0~105) + 4단계 임시 운영 기준 배지.
function buildOverallBlock(data, d) {
  var overall = d.overallTiers[data.overallTierIdx];
  var block = document.createElement('div');
  block.className = 'overall-block';

  var scoreRow = document.createElement('div');
  scoreRow.className = 'overall-score-row';
  var scoreSpan = document.createElement('span');
  scoreSpan.className = 'overall-score';
  scoreSpan.appendChild(document.createTextNode(data.totalScore + ' '));
  var maxSpan = document.createElement('span');
  maxSpan.className = 'overall-max';
  maxSpan.textContent = '/ 105 (' + d.totalLabel + ')';
  scoreSpan.appendChild(maxSpan);
  scoreRow.appendChild(scoreSpan);

  var titleSpan = document.createElement('span');
  titleSpan.className = 'overall-title ' + overall.class;
  titleSpan.textContent = overall.title;
  scoreRow.appendChild(titleSpan);
  block.appendChild(scoreRow);

  var note = document.createElement('div');
  note.className = 'overall-temp-note';
  note.textContent = d.tempCriteriaNote;
  block.appendChild(note);

  return block;
}

// 7개 핵심 영역을 실제 점수·최고점·환산 점수(pct)로 비교하는 카드 그리드.
// 문항 수·최고점이 영역마다 달라 단순 합계로는 비교할 수 없으므로, 반드시
// pct(환산 점수) 막대로만 시각적 비교를 한다.
function buildDomainGrid(data, d) {
  var grid = document.createElement('div');
  grid.className = 'domain-grid';

  data.results.forEach(function (r) {
    var isHighlight = data.highlightDomains.indexOf(r.domainKey) !== -1;
    var card = document.createElement('div');
    card.className = 'domain-card' + (isHighlight ? ' is-highlight' : '');

    var top = document.createElement('div');
    top.className = 'dc-top';
    var name = document.createElement('span');
    name.className = 'dc-name';
    name.textContent = d.domainLabels[r.domainKey];
    var pct = document.createElement('span');
    pct.className = 'dc-pct';
    pct.textContent = r.pct + '%';
    top.appendChild(name);
    top.appendChild(pct);
    card.appendChild(top);

    var track = document.createElement('div');
    track.className = 'dc-bar-track';
    var fill = document.createElement('div');
    fill.className = 'dc-bar-fill';
    fill.style.width = r.pct + '%';
    track.appendChild(fill);
    card.appendChild(track);

    var score = document.createElement('div');
    score.className = 'dc-score';
    score.textContent = r.sum + ' / ' + r.max;
    card.appendChild(score);

    if (isHighlight) {
      var badge = document.createElement('div');
      badge.className = 'dc-badge';
      badge.textContent = d.highlightLabel;
      card.appendChild(badge);
    }

    grid.appendChild(card);
  });

  return grid;
}

// 1단계: 오늘의 컨디션 요약 (배경색을 달리해 강조)
function buildStep1(data, d) {
  var card = makeSectionCard(true);
  addStepTitle(card, d.title1);
  var narrative = d.overallNarratives[data.overallTierIdx];
  addParagraph(card, narrative.body[0]);
  return card;
}

// 2단계: 이번 결과를 이렇게 이해해보세요
function buildStep2(data, d) {
  var card = makeSectionCard(false);
  addStepTitle(card, d.title2);
  var narrative = d.overallNarratives[data.overallTierIdx];
  addParagraph(card, narrative.body[1]);
  addParagraph(card, narrative.body[2]);
  return card;
}

function buildAreaCard(domainKey, d) {
  var guide = d.domainGuides[domainKey];
  var card = document.createElement('div');
  card.className = 'area-card';
  var h3 = document.createElement('h3');
  h3.textContent = d.domainLabels[domainKey];
  card.appendChild(h3);
  guide.meaning.forEach(function (p) { addParagraph(card, p); });
  return card;
}

// 3+4단계: 먼저 살펴볼 영역 / 함께 연결해서 볼 영역.
// mode별로 완전히 다른 레이아웃을 쓴다:
//  - none : 이 함수를 호출하지 않음(전 영역 0점 문구는 별도 처리)
//  - single: 1위 영역 카드 + (2위가 있으면) 연결 문구, 없으면 안내 문구
//  - pair : 두 영역을 동급 카드로 표시 + 21개 조합 연결 문구
//  - many : 순위를 매기지 않고 모든 동점 영역을 카드로 표시 + 전용 안내문
function buildStep3And4(data, d, plan) {
  if (plan.mode === 'none') {
    var noneCard = makeSectionCard(false);
    addStepTitle(noneCard, d.title3);
    addParagraph(noneCard, d.allZeroMessage);
    return [noneCard];
  }

  if (plan.mode === 'many') {
    var manyCard = makeSectionCard(false);
    addStepTitle(manyCard, d.titleMany);
    addParagraph(manyCard, d.manyHighDomainsMessage);
    var group = document.createElement('div');
    group.className = 'area-card-group';
    plan.domains.forEach(function (domainKey) {
      var mini = document.createElement('div');
      mini.className = 'area-card';
      var h3 = document.createElement('h3');
      h3.textContent = d.domainLabels[domainKey];
      mini.appendChild(h3);
      addParagraph(mini, d.domainGuides[domainKey].meaning[0]);
      group.appendChild(mini);
    });
    manyCard.appendChild(group);
    return [manyCard];
  }

  if (plan.mode === 'pair') {
    var pairCard3 = makeSectionCard(false);
    addStepTitle(pairCard3, d.title3);
    var pairGroup = document.createElement('div');
    pairGroup.className = 'area-card-group';
    pairGroup.appendChild(buildAreaCard(plan.domains[0], d));
    pairGroup.appendChild(buildAreaCard(plan.domains[1], d));
    pairCard3.appendChild(pairGroup);

    var pairCard4 = makeSectionCard(false);
    addStepTitle(pairCard4, d.title4);
    var pairTextWrap = document.createElement('div');
    pairTextWrap.className = 'connection-text';
    getPairText(d, plan.domains[0], plan.domains[1]).forEach(function (p) { addParagraph(pairTextWrap, p); });
    pairCard4.appendChild(pairTextWrap);
    return [pairCard3, pairCard4];
  }

  // mode === 'single'
  var singleCard3 = makeSectionCard(false);
  addStepTitle(singleCard3, d.title3);
  singleCard3.appendChild(buildAreaCard(plan.top, d));

  var singleCard4 = makeSectionCard(false);
  addStepTitle(singleCard4, d.title4);
  if (plan.second) {
    var connWrap = document.createElement('div');
    connWrap.className = 'connection-text';
    getPairText(d, plan.top, plan.second).forEach(function (p) { addParagraph(connWrap, p); });
    singleCard4.appendChild(connWrap);
  } else {
    addParagraph(singleCard4, d.secondBelow35);
  }
  return [singleCard3, singleCard4];
}

// 5단계: 조금 더 살펴본 응답 — 핵심 35문항 전체에서 상위 응답 최대 3개
// (0점 제외, 동점이면 원래 문항 순서 유지). 모든 문항이 0점이면 이
// 단계 자체를 숨긴다.
function buildStep5(data, d) {
  if (!data.topItemIds || data.topItemIds.length === 0) return null;
  var card = makeSectionCard(false);
  addStepTitle(card, d.title5);
  var ol = document.createElement('ol');
  data.topItemIds.forEach(function (id) {
    var li = document.createElement('li');
    li.textContent = d.items[id] || '';
    ol.appendChild(li);
  });
  card.appendChild(ol);
  return card;
}

// 6단계: 이미 하고 있는 회복 방법 — 생활관리 선택을 단순 태그가 아니라
// 결과와 연결된 문장으로 보여준다.
function buildStep6(data, d, plan) {
  var card = makeSectionCard(false);
  addStepTitle(card, d.title6);

  var selected = data.lifestyleSelected || [];
  var links = d.lifestyleLinks;

  if (selected.indexOf('none') !== -1) {
    addParagraph(card, links.noMatchTemplate);
    return card;
  }
  if (selected.length === 0) {
    addParagraph(card, links.noneSelectedTemplate);
    return card;
  }

  addParagraph(card, links.selectedIntro);

  var tags = document.createElement('div');
  tags.className = 'lifestyle-tags';
  selected.forEach(function (key) {
    var tag = document.createElement('span');
    tag.className = 'lifestyle-tag';
    var label = d.lifestyleItems[key] || key;
    if (key === 'other' && data.lifestyleOtherText) label += ' (' + data.lifestyleOtherText + ')';
    tag.textContent = label;
    tags.appendChild(tag);
  });
  card.appendChild(tags);

  // 예시로 준비된 5개 조합(생활관리 key + 영역 key)에 해당하면 구체적인
  // 연결 문장을 하나 더 보여준다. 대상 영역은 1위(또는 동점 영역들) 전체.
  var targetDomains = planTargetDomains(plan);
  var shown = {};
  selected.forEach(function (key) {
    var exByDomain = links.examples[key];
    if (!exByDomain) return;
    targetDomains.forEach(function (domainKey) {
      if (exByDomain[domainKey] && !shown[key + '|' + domainKey]) {
        shown[key + '|' + domainKey] = true;
        addParagraph(card, exByDomain[domainKey]);
      }
    });
  });

  return card;
}

// plan에서 "지금 중점적으로 보는 영역" 목록을 뽑아낸다 — 7일 행동/
// 상담질문/비교항목/생활관리 연결에서 공통으로 쓴다.
function planTargetDomains(plan) {
  if (plan.mode === 'single') return plan.second ? [plan.top, plan.second] : [plan.top];
  if (plan.mode === 'pair') return plan.domains.slice();
  if (plan.mode === 'many') return plan.focusDomains.slice();
  return [];
}

// 영역의 actions 배열에서 생활관리 우선순위를 반영해 하나를 고른다.
// usedTexts에 이미 있는 문구는 건너뛰어 같은 행동이 중복되지 않게 한다.
function pickAction(domainKey, d, lifestyleSelected, usedTexts) {
  var guide = d.domainGuides[domainKey];
  var priorityMap = LIFESTYLE_ACTION_PRIORITY[domainKey] || {};
  var priorityIdx = null;
  (lifestyleSelected || []).forEach(function (key) {
    if (priorityIdx === null && priorityMap[key] !== undefined) priorityIdx = priorityMap[key];
  });
  var order = guide.actions.map(function (a, i) { return i; });
  if (priorityIdx !== null) {
    order = [priorityIdx].concat(order.filter(function (i) { return i !== priorityIdx; }));
  }
  for (var i = 0; i < order.length; i++) {
    var candidate = guide.actions[order[i]];
    if (usedTexts.indexOf(candidate.text) === -1) return candidate;
  }
  return guide.actions[order[0]];
}

// 7단계: 나를 위한 7일 실천 (배경색을 달리해 강조). 최대 3개, 체크박스
// 형태 + 이유 한 문장. 같은 영역에서 중복된 행동을 뽑지 않는다.
function buildStep7(data, d, plan) {
  if (plan.mode === 'none') return null;

  var picks = [];
  var usedTexts = [];
  var lifestyleSelected = data.lifestyleSelected || [];

  if (plan.mode === 'single') {
    var a1 = pickAction(plan.top, d, lifestyleSelected, usedTexts);
    picks.push(a1); usedTexts.push(a1.text);
    var a2 = pickAction(plan.top, d, lifestyleSelected, usedTexts);
    if (a2.text !== a1.text) { picks.push(a2); usedTexts.push(a2.text); }
    if (plan.second) {
      var secondPct = data.results.filter(function (r) { return r.domainKey === plan.second; })[0].pct;
      if (secondPct >= 50) {
        var a3 = pickAction(plan.second, d, lifestyleSelected, usedTexts);
        picks.push(a3); usedTexts.push(a3.text);
      }
    }
  } else if (plan.mode === 'pair') {
    plan.domains.forEach(function (domainKey) {
      var a = pickAction(domainKey, d, lifestyleSelected, usedTexts);
      picks.push(a); usedTexts.push(a.text);
    });
  } else if (plan.mode === 'many') {
    plan.focusDomains.forEach(function (domainKey) {
      if (picks.length >= 3) return;
      var a = pickAction(domainKey, d, lifestyleSelected, usedTexts);
      picks.push(a); usedTexts.push(a.text);
    });
  }

  picks = picks.slice(0, 3);
  if (picks.length === 0) return null;

  var card = makeSectionCard(true);
  addStepTitle(card, d.title7);
  var ul = document.createElement('ul');
  ul.className = 'plan-list';
  picks.forEach(function (action) {
    var li = document.createElement('li');
    li.className = 'plan-item';
    var box = document.createElement('span');
    box.className = 'plan-checkbox';
    box.textContent = '□';
    var body = document.createElement('div');
    body.className = 'plan-body';
    var textEl = document.createElement('div');
    textEl.className = 'plan-text';
    textEl.textContent = action.text;
    var reasonEl = document.createElement('div');
    reasonEl.className = 'plan-reason';
    reasonEl.textContent = action.reason;
    body.appendChild(textEl);
    body.appendChild(reasonEl);
    li.appendChild(box);
    li.appendChild(body);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  return card;
}

// 8단계: 다음 체크에서 비교할 것 — 대상 영역들의 비교 항목 중 최대 2개.
function buildStep8(data, d, plan) {
  if (plan.mode === 'none') return null;
  var targets = planTargetDomains(plan);
  if (targets.length === 0) return null;

  var items = [];
  if (targets.length === 1) {
    items = d.domainGuides[targets[0]].compareItems.slice(0, 2);
  } else {
    targets.slice(0, 2).forEach(function (domainKey) {
      items.push(d.domainGuides[domainKey].compareItems[0]);
    });
  }
  if (items.length === 0) return null;

  var card = makeSectionCard(false);
  addStepTitle(card, d.title8);
  var ul = document.createElement('ul');
  ul.className = 'plain-list';
  items.forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
  card.appendChild(ul);
  addParagraph(card, d.nextCheckCopy.note1);
  addParagraph(card, d.nextCheckCopy.note2);
  return card;
}

// 9단계: 상담 시 함께 살펴볼 내용 — 대상 영역들의 상담 질문 최대 2개.
function buildStep9(data, d, plan) {
  if (plan.mode === 'none') return null;
  var targets = planTargetDomains(plan);
  if (targets.length === 0) return null;

  var card = makeSectionCard(false);
  addStepTitle(card, d.title9);
  addParagraph(card, d.consultIntro);
  var ul = document.createElement('ul');
  ul.className = 'plain-list';
  targets.slice(0, 2).forEach(function (domainKey) {
    var li = document.createElement('li');
    li.textContent = d.domainGuides[domainKey].consultQuestion;
    ul.appendChild(li);
  });
  card.appendChild(ul);
  return card;
}

// index.html의 CYCLE_THEMES와 동일한 순서(키만 유지) — 동점 유형의
// 표시 순서를 원본 문항 순서와 맞추기 위해 여기서도 그대로 정의한다.
var CYCLE_THEME_KEYS = ['body', 'emotion', 'discomfort', 'appetiteSkin', 'fatigue', 'timing'];

// 10단계: 생리 전후 컨디션 결과 — 점수나 등급, 문항 원문은 표시하지
// 않는다. index.html이 계산한 유형별 최고 점수(themeScores, 0~3)와
// 전체 최고 점수(overallMaxScore)만으로 다음 순서를 그린다:
// (1) 전체 요약 (2) 두드러진 변화 유형 최대 3개 (3) 유형별 해석
// (4) 다음 생리 때 기록할 내용 (5) 일상 안내 (6) 전문가 확인 안내.
// 비단정 안내는 유형마다 반복하지 않고 블록 맨 아래에 한 번만 둔다.
function buildCycleBlock(data, d) {
  var card = makeSectionCard(false);
  addStepTitle(card, d.cycleTitle);

  var cc = data.cycleCheck;
  var themeScores = cc.themeScores || {};
  var overallMax = cc.overallMaxScore || 0;

  // 1. 전체 요약
  addParagraph(card, d.cycleSummaries[overallMax]);

  // 점수가 0인 유형은 표시하지 않는다. 동점이면 원래 유형 순서(위
  // CYCLE_THEME_KEYS)를 유지한 채 최대 3개까지만 보여준다.
  var topThemes = CYCLE_THEME_KEYS
    .map(function (key) { return { key: key, score: themeScores[key] || 0 }; })
    .filter(function (t) { return t.score > 0; })
    .sort(function (a, b) { return b.score - a.score; })
    .slice(0, 3);

  if (topThemes.length > 0) {
    // 2. 상대적으로 두드러진 변화 유형(태그로 이름만 먼저 보여줌)
    var highlightLabel = document.createElement('div');
    highlightLabel.className = 'section-label';
    highlightLabel.textContent = d.cycleHighlightLabel;
    card.appendChild(highlightLabel);

    var tags = document.createElement('div');
    tags.className = 'lifestyle-tags';
    topThemes.forEach(function (t) {
      var tag = document.createElement('span');
      tag.className = 'lifestyle-tag';
      tag.textContent = d.cycleThemeLabels[t.key];
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    // 3. 변화 유형별 부드러운 해석 — 문항 원문 대신 유형 단위 문장을 쓴다.
    var detailLabel = document.createElement('div');
    detailLabel.className = 'section-label';
    detailLabel.textContent = d.cycleThemeDetailLabel;
    card.appendChild(detailLabel);

    var themeGroup = document.createElement('div');
    themeGroup.className = 'area-card-group';
    topThemes.forEach(function (t) {
      var mini = document.createElement('div');
      mini.className = 'area-card';
      var h3 = document.createElement('h3');
      h3.textContent = d.cycleThemeLabels[t.key];
      mini.appendChild(h3);
      var tier = document.createElement('div');
      tier.className = 'cycle-theme-tier';
      tier.textContent = d.cycleThemeTierLabels[t.score];
      mini.appendChild(tier);
      addParagraph(mini, d.cycleThemeCopy[t.key]);
      themeGroup.appendChild(mini);
    });
    card.appendChild(themeGroup);
  }

  // 4. 다음 생리 때 기록해볼 내용 — 최대 3개
  var trackLabel = document.createElement('div');
  trackLabel.className = 'section-label';
  trackLabel.textContent = d.cycleTrackLabel;
  card.appendChild(trackLabel);
  var trackList = document.createElement('ul');
  trackList.className = 'plain-list';
  d.cycleTrackItems.slice(0, 3).forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    trackList.appendChild(li);
  });
  card.appendChild(trackList);

  // 5. 일상에서 살펴볼 부분
  var dailyLabel = document.createElement('div');
  dailyLabel.className = 'section-label';
  dailyLabel.textContent = d.cycleDailyLabel;
  card.appendChild(dailyLabel);
  addParagraph(card, d.cycleDailyGuidance);

  // 6. 필요한 경우 전문가 확인 안내 + 공통 비단정 문구(블록당 한 번만)
  var expertLabel = document.createElement('div');
  expertLabel.className = 'section-label';
  expertLabel.textContent = d.cycleExpertLabel;
  card.appendChild(expertLabel);
  addParagraph(card, d.cycleExpertNotice);
  addParagraph(card, d.cycleNonDiagnosticNote, 'muted-note');

  return card;
}

function buildSafetyBlock(d) {
  var block = document.createElement('div');
  block.className = 'safety-block';
  var p1 = document.createElement('p');
  p1.textContent = d.safetyNotice1;
  var p2 = document.createElement('p');
  p2.textContent = d.safetyNotice2;
  block.appendChild(p1);
  block.appendChild(p2);
  return block;
}

function applyTranslations() {
  var d = dict();
  document.title = d.pageTitle;
  document.documentElement.lang = currentLang;
  setText('brand-sub', d.brandSub);
  setText('page-title', d.heroTitle);
  setText('page-desc', d.heroDesc);
  setText('page-footer', d.footer);
  renderResult();
}

function setLanguage(lang) {
  if (lang !== 'ko' && lang !== 'en') lang = 'ko';
  currentLang = lang;
  try { sessionStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyTranslations();
}

// ── 부모(메인 사이트)와의 언어 동기화 ── index.html과 동일한 검증 규칙.
window.addEventListener('message', function (event) {
  if (PARENT_ALLOWED_ORIGINS.indexOf(event.origin) === -1) return;
  if (event.source !== window.parent) return;
  var data = event.data;
  if (!data || data.source !== '730-main-site' || data.type !== 'language-change') return;
  if (data.language !== 'ko' && data.language !== 'en') return;
  setLanguage(data.language);
});

// document.referrer는 이 문서를 iframe으로 띄운 부모 페이지의 주소다(같은
// 값이 페이지 로드 내내 바뀌지 않으므로 한 번만 계산해도 된다). 그 origin이
// PARENT_ALLOWED_ORIGINS 화이트리스트에 있을 때만 "안전하게 확인됨"으로
// 본다 — referrer가 없거나(리퍼러 정책 등으로 비어있는 경우) 화이트리스트
// 밖이면 null을 돌려주고, 호출하는 쪽에서 그 경우 메시지 전송 자체를 하지
// 않거나(ready) '*'로 대체한다(height, 기존 동작 유지 목적).
function getParentOrigin() {
  try {
    if (!document.referrer) return null;
    var refOrigin = new URL(document.referrer).origin;
    return PARENT_ALLOWED_ORIGINS.indexOf(refOrigin) !== -1 ? refOrigin : null;
  } catch (e) {
    return null;
  }
}

// ready 메시지는 부모 origin을 안전하게 확인했을 때만 보낸다 — 확인이
// 안 되면(referrer 없음 등) 아예 보내지 않는다('*'로 대신 보내지 않음).
function notifyParentReady() {
  var origin = getParentOrigin();
  if (!origin) return;
  try {
    window.parent.postMessage({ source: '730-skin-check', type: 'ready' }, origin);
  } catch (e) {}
}

// index.html에서 넘어오는 시점에는 postMessage보다 sessionStorage 값이
// 먼저 확실히 존재하므로, 그 값으로 즉시 그린 뒤 부모에게 ready를 보내
// 최신 언어를 다시 받는다 — 한국어로 잠깐 보였다가 바뀌는 현상을 줄인다.
currentLang = readStoredLang();
applyTranslations();
notifyParentReady();
</script>
<script>
// iframe으로 이 페이지를 감싸는 부모 문서에 실제 콘텐츠 높이를 알려준다.
// postMessage는 origin이 달라도(cross-origin) 항상 동작해서, 로컬 개발
// 서버처럼 부모와 origin이 다른 환경에서도 iframe 높이가 정확히 맞춰진다.
(function () {
  function reportHeight() {
    // documentElement.scrollHeight는 "콘텐츠 높이와 뷰포트 높이 중 큰 값"을
    // 반환한다. 이전 페이지(체크리스트)에서 이미 iframe이 크게 늘어난 상태로
    // 이 페이지로 넘어오면, 뷰포트 자체가 커서 실제 콘텐츠보다 큰 값을 그대로
    // 돌려주는 문제가 있다. body.scrollHeight는 뷰포트 크기와 무관하게 실제
    // 콘텐츠 높이만 반영하므로 이 문제가 없다.
    // targetOrigin은 가능하면 getParentOrigin()(위 스크립트에서 정의, 같은
    // 문서라 전역에서 접근 가능)으로 확인한 안전한 부모 origin을 쓰고,
    // 확인이 안 되는 경우에만 기존처럼 '*'로 대체해 높이 조절 기능 자체는
    // 계속 동작하게 한다.
    var targetOrigin = (typeof getParentOrigin === 'function' && getParentOrigin()) || '*';
    window.parent.postMessage({
      source: '730skin-check-embed',
      height: document.body.scrollHeight
    }, targetOrigin);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    window.addEventListener('load', reportHeight);
  }
  reportHeight();
})();
</script>
