<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>730 SKIN EAR THERAPY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="search-area" role="search">
        <button type="button" class="search-btn" aria-label="이어밸런스체크 페이지로 이동">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
        </button>
        <input type="text" class="search-box" placeholder="검색" aria-label="검색어 입력, Enter 키를 누르면 이어밸런스체크 페이지로 이동합니다">
      </div>

      <div class="auth-area" id="auth-area">
        <button type="button" class="auth-login-btn" id="auth-login-btn">로그인</button>
        <div class="auth-user" id="auth-user" hidden>
          <span class="auth-user-email" id="auth-user-email"></span>
          <button type="button" class="auth-profile-btn" id="auth-profile-btn">내 프로필</button>
          <button type="button" class="auth-logout-btn" id="auth-logout-btn">로그아웃</button>
        </div>
      </div>

      <button type="button" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="main-nav">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>

    <h1 class="logo">
      <a href="#/" class="brand-logo" data-route="home" aria-label="730 스킨이어테라피 홈으로 이동">730SKINEARTHERAPY</a>
    </h1>

    <nav class="main-nav" id="main-nav" aria-label="주요 메뉴">
      <ul>
        <li><a href="#/ear-check" data-route="ear-check">이어밸런스체크</a></li>
        <li><a href="#/ear-point" data-route="ear-point">이어포인트</a></li>
        <li><a href="#/products" data-route="products">상품</a></li>
        <li><a href="#/seminar" data-route="seminar">세미나신청</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer"></footer>

<button type="button" id="scroll-top-btn" class="scroll-top-btn" aria-label="맨 위로 이동">
  <svg class="scroll-top-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
</button>

<div class="auth-modal" id="auth-modal" hidden>
  <div class="auth-modal-backdrop" id="auth-modal-backdrop"></div>
  <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <button type="button" class="auth-modal-close" id="auth-modal-close" aria-label="닫기">×</button>

    <div class="auth-modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12.5 3C9 3 6.5 6 6.5 9.7c0 2.2.9 3.3 1.4 4.9.4 1.2.3 2 .3 2.9 0 1.9 1.4 3.5 3.4 3.5 1 0 1.7-.6 1.7-1.5 0-.8-.6-1.1-.6-2 0-.7.6-1.1 1.3-1.2 2.3-.4 3.9-2.5 3.9-5.7C18.9 6.4 16.3 3 12.5 3Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 9.3c1 0 1.8.9 1.8 2.1 0 .9-.5 1.4-1 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h2 class="auth-modal-title" id="auth-modal-title">730SKIN</h2>
    <p class="auth-modal-desc" id="auth-modal-desc">이어포인트를 저장하고<br>세미나를 더욱 편리하게 이용하세요.</p>

    <form class="auth-form" id="auth-form">
      <div class="auth-field auth-signup-only" id="auth-name-field" hidden>
        <label for="auth-name">이름</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M5 19c1.2-3.4 4-5 7-5s5.8 1.6 7 5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          <input type="text" id="auth-name" name="name" autocomplete="name" placeholder="이름">
        </div>
      </div>

      <div class="auth-field">
        <label for="auth-email">이메일</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15v11h-15z" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4.5 7.2l7.5 5.6 7.5-5.6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input type="email" id="auth-email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="auth-field auth-signup-only" id="auth-phone-field" hidden>
        <label for="auth-phone">휴대폰 번호</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M10.5 17.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input type="tel" id="auth-phone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="010-1234-5678" maxlength="13">
        </div>
      </div>

      <div class="auth-field">
        <label for="auth-password">비밀번호</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          <input type="password" id="auth-password" name="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
          <button type="button" class="auth-toggle-password" id="auth-toggle-password" aria-label="비밀번호 표시" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5.5 12 5.5 22.5 12 22.5 12 18.5 18.5 12 18.5 1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          </button>
        </div>
        <p class="auth-field-hint auth-signup-only" id="auth-password-hint" hidden>영문과 숫자를 포함해 8자 이상 입력해주세요.</p>
      </div>

      <div class="auth-field auth-signup-only" id="auth-password-confirm-field" hidden>
        <label for="auth-password-confirm">비밀번호 확인</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          <input type="password" id="auth-password-confirm" name="password_confirm" autocomplete="new-password" placeholder="••••••••">
        </div>
        <p class="auth-field-error" id="auth-password-confirm-error" hidden>비밀번호가 일치하지 않습니다.</p>
      </div>

      <label class="auth-checkbox-field auth-signup-only" id="auth-privacy-field" hidden>
        <input type="checkbox" id="auth-privacy-agree">
        <span>개인정보 처리방침에 동의합니다. <span class="auth-required">(필수)</span></span>
      </label>

      <label class="auth-checkbox-field auth-signup-only" id="auth-marketing-field" hidden>
        <input type="checkbox" id="auth-marketing-agree">
        <span>이벤트 · 교육 · 신제품 안내 수신에 동의합니다. <span class="auth-optional">(선택)</span></span>
      </label>

      <p class="auth-error" id="auth-error" hidden></p>
      <p class="auth-notice" id="auth-notice" hidden></p>
      <button type="button" class="auth-resend-btn" id="auth-resend-btn" hidden>인증메일 다시 보내기</button>

      <button type="submit" class="auth-submit-btn" id="auth-submit-btn">로그인</button>
    </form>

    <p class="auth-switch-mode">
      <span id="auth-switch-text">아직 회원이 아니신가요?</span>
      <button type="button" class="auth-switch-link" id="auth-switch-link">회원가입 →</button>
    </p>
  </div>
</div>

<div class="auth-modal" id="profile-modal" hidden>
  <div class="auth-modal-backdrop" id="profile-modal-backdrop"></div>
  <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
    <button type="button" class="auth-modal-close" id="profile-modal-close" aria-label="닫기">×</button>

    <div class="auth-modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 20c1.4-4 4.5-6 7.5-6s6.1 2 7.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>

    <h2 class="auth-modal-title" id="profile-modal-title">내 프로필</h2>
    <p class="auth-modal-desc">몇 가지 정보를 더 알려주시면<br>더 편리하게 이용하실 수 있어요.</p>

    <form class="auth-form" id="profile-form">
      <div class="auth-field">
        <label for="profile-name">이름</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M5 19c1.2-3.4 4-5 7-5s5.8 1.6 7 5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          <input type="text" id="profile-name" name="name" placeholder="이름">
        </div>
      </div>

      <div class="auth-field">
        <label for="profile-phone">휴대폰 번호</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M10.5 17.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input type="tel" id="profile-phone" name="phone" placeholder="010-0000-0000">
        </div>
      </div>

      <div class="auth-field">
        <label for="profile-gender">성별</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="14" r="5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M14 10l5.5-5.5M19.5 4.5h-4M19.5 4.5v4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="profile-gender" name="gender">
            <option value="">선택 안 함</option>
            <option value="female">여성</option>
            <option value="male">남성</option>
          </select>
        </div>
      </div>

      <div class="auth-field">
        <label for="profile-age">나이</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4 9.5h16M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input type="number" id="profile-age" name="age" placeholder="나이" min="1" max="120">
        </div>
      </div>

      <label class="auth-checkbox-field" id="profile-marketing-field">
        <input type="checkbox" id="profile-marketing-agree">
        <span>이벤트 · 교육 · 신제품 안내 수신에 동의합니다.</span>
      </label>

      <p class="auth-error" id="profile-error" hidden></p>

      <button type="submit" class="auth-submit-btn" id="profile-submit-btn">저장</button>
    </form>
  </div>
</div>
